<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Jimmy Wang</title>
  <desc id="description">Algorithms, systems, and useful tools</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#102a43"/>
      <stop offset="1" stop-color="#123b46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d8f6ff" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000814" flood-opacity="0.3"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1020" cy="52" r="260" fill="url(#glow)"/>
    <circle cx="116" cy="336" r="220" fill="url(#glow)" opacity="0.55"/>

    <g fill="none" stroke-linecap="round">
      <path d="M886 82h118l38 38v142H886z" stroke="#a5f3fc" stroke-opacity="0.2" stroke-width="2"/>
      <path d="M1004 82v38h38" stroke="#a5f3fc" stroke-opacity="0.2" stroke-width="2"/>
      <path d="M916 156l31 25-31 25M1008 156l-31 50" stroke="url(#accent)" stroke-opacity="0.72" stroke-width="7"/>
      <path d="M842 279h245" stroke="#a5f3fc" stroke-opacity="0.14" stroke-width="2"/>
      <circle cx="1090" cy="278" r="6" fill="#86efac" stroke="none"/>
      <circle cx="1112" cy="278" r="6" fill="#67e8f9" stroke="none"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="76" y="72" width="7" height="216" rx="3.5" fill="url(#accent)"/>
    </g>

    <text x="120" y="151" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="64" font-weight="700" letter-spacing="-2">Jimmy Wang</text>
    <text x="124" y="205" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" letter-spacing="1">Algorithms · Systems · Useful Tools</text>
    <text x="124" y="254" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Competitive programmer and developer at Xi'an Jiaotong University</text>

    <g transform="translate(124 284)">
      <circle cx="7" cy="7" r="7" fill="#86efac"/>
      <text x="25" y="13" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17">learning, building, sharing</text>
    </g>
  </g>
</svg>
